<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atelier Street</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M20 8 Q32 16 44 8 L60 18 L54 30 L46 26 L46 58 L18 58 L18 26 L10 30 L4 18 Z' fill='%23b5562b'/%3E%3C/svg%3E">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #111; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  canvas { display: block; }
  [hidden] { display: none !important; }
  #start { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; background: radial-gradient(ellipse at center, rgba(0,0,0,.25), rgba(0,0,0,.7)); cursor: pointer; z-index: 5; }
  #start h1 { font: 300 64px/1 Georgia, serif; letter-spacing: .3em; margin: 0 0 10px .3em; }
  #start p { margin: 6px; opacity: .9; }
  .keys { margin-top: 22px; display: inline-grid; grid-template-columns: auto auto; gap: 6px 16px; text-align: left; font-size: 14px; opacity: .85; }
  kbd { background: rgba(255,255,255,.18); border-radius: 4px; padding: 2px 7px; font-family: inherit; }
  #crosshair { position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px; border-radius: 50%; background: rgba(255,255,255,.8); pointer-events: none; z-index: 2; }
  #prompt { position: fixed; left: 50%; bottom: 14%; transform: translateX(-50%); background: rgba(0,0,0,.55); padding: 10px 18px; border-radius: 999px; font-size: 16px; pointer-events: none; z-index: 2; }
  #shopFrame { position: fixed; inset: 3vh 3vw; border: 0; border-radius: 18px; box-shadow: 0 20px 60px rgba(0,0,0,.5); background: #f4f1ec; z-index: 10; width: 94vw; height: 94vh; }
  #closeShop { position: fixed; top: calc(3vh + 12px); right: calc(3vw + 12px); z-index: 11; font: 600 15px -apple-system, sans-serif; border: 0; border-radius: 10px; padding: 10px 16px; background: #1d1b18; color: #fff; cursor: pointer; }
  #wtoast { position: fixed; left: 50%; top: 4%; transform: translateX(-50%); background: rgba(18,16,13,.94); border: 1px solid rgba(255,255,255,.22); color: #fff; padding: 12px 22px; border-radius: 999px; font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; z-index: 12; max-width: 88vw; text-align: center; box-shadow: 0 12px 34px rgba(0,0,0,.5); }
</style>
</head>
<body>
<div id="start">
  <div>
    <h1>ATELIER</h1>
    <p id="status">Loading the street…</p>
    <div class="keys">
      <span><kbd>W A S D</kbd></span><span>walk</span>
      <span><kbd>Shift</kbd></span><span>walk faster</span>
      <span>mouse</span><span>look around</span>
      <span><kbd>E</kbd></span><span>talk to Yanis or Rin / try a design</span>
      <span><kbd>M</kbd></span><span>sound on / off</span>
      <span><kbd>Esc</kbd></span><span>pause</span>
    </div>
  </div>
</div>
<div id="crosshair" hidden></div>
<div id="prompt" hidden></div>
<div id="wtoast" hidden></div>
<iframe id="shopFrame" hidden allow="camera; fullscreen" title="Atelier shop"></iframe>
<button id="closeShop" hidden>← Back to the street</button>
<script type="importmap">
{ "imports": {
  "three": "/vendor/three/build/three.module.js",
  "three/addons/": "/vendor/three/examples/jsm/"
} }
</script>
<script>
/* 3D preflight: when WebGL cannot start (blocked or crashed GPU) or the world never gets
   going, say so and retry — instead of an endless silent "Loading the street…". */
(function () {
  var statusEl = document.getElementById('status');
  var tries = Number(sessionStorage.getItem('streetRetry') || 0);
  function retryOrShow(msg) {
    if (tries < 2) {
      sessionStorage.setItem('streetRetry', String(tries + 1));
      statusEl.textContent = msg + ' — retrying…';
      setTimeout(function () { location.reload(); }, 2500);
    } else {
      sessionStorage.removeItem('streetRetry');
      statusEl.textContent = msg + ' — click to retry';
      document.getElementById('start').addEventListener('click', function () { location.reload(); });
    }
  }
  var gl = null;
  try { var probe = document.createElement('canvas'); gl = probe.getContext('webgl2') || probe.getContext('webgl'); } catch (e) {}
  if (!gl) return retryOrShow('3D could not start (the browser is blocking 3D)');
  var lose = gl.getExtension('WEBGL_lose_context'); if (lose) lose.loseContext();
  setTimeout(function () { // the world made its canvas → all good, forget earlier retries
    if (document.querySelector('canvas') || (statusEl.textContent || '').indexOf('Click to enter') === 0) sessionStorage.removeItem('streetRetry');
    else retryOrShow('The street did not load');
  }, 20000);
})();
</script>
<script type="module" src="street.js"></script>
</body>
</html>
